<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Gift · Voice Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* ============ PREMIUM DARK GLASS UI ============ */
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#09090b;
    --surface:#121214;
    --surface-hover:#1c1c21;
    --border:#27272a;
    --border-glow:rgba(139, 92, 246, 0.3);
    --txt:#fafafa;
    --txt-2:#a1a1aa;
    --muted:#71717a;
    --primary:#8b5cf6;
    --primary-2:#ec4899;
    --primary-glow:rgba(139,92,246,.5);
    --success:#10b981;
    --danger:#ef4444;
    --warn:#f59e0b;
    --radius:20px;
    --radius-sm:14px;
    --grad:linear-gradient(135deg, var(--primary), var(--primary-2));
    --font:'Plus Jakarta Sans', system-ui, sans-serif;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--txt);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:30px 20px 140px;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    background-image: 
      radial-gradient(circle at 15% 0%, rgba(139,92,246,.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(236,72,153,.1) 0%, transparent 40%);
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .app{max-width:1000px;width:100%;margin:0 auto;flex:1}

  /* HEADER */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:36px}
  .brand{display:flex;align-items:center;gap:16px}
  .logo{
    width:56px;height:56px;border-radius:18px;flex-shrink:0;
    background:var(--grad);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 30px -5px var(--primary-glow);
    position:relative;overflow:hidden;
  }
  .logo::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.2))}
  .logo i{font-size:26px;color:#fff;position:relative;z-index:1}
  .brand h1{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
  .brand p{font-size:13px;color:var(--txt-2);font-weight:500;margin-top:4px}
  .pill{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);
    padding:8px 16px;border-radius:100px;font-size:12px;font-weight:700;
    color:var(--success);backdrop-filter:blur(10px);
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 6px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

  /* STUDIO CARD */
  .studio{
    background:rgba(18,18,20,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--border);border-radius:24px;padding:28px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.02) inset;
    margin-bottom:30px;position:relative;overflow:hidden;
  }
  .studio::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:var(--grad);opacity:.8;
  }
  .section-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--txt-2);margin-bottom:12px}
  .section-label i{color:var(--primary)}
  .textarea-wrap{position:relative;margin-bottom:20px}
  textarea{
    width:100%;min-height:140px;max-height:300px;resize:vertical;
    padding:18px 48px 18px 18px;border-radius:var(--radius-sm);
    background:rgba(0,0,0,.3);border:1px solid var(--border);
    font-size:16px;line-height:1.6;color:var(--txt);
    transition:all .2s;
  }
  textarea::placeholder{color:var(--muted)}
  textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--border-glow);background:rgba(0,0,0,.5)}
  .clear-btn{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--surface-hover);color:var(--txt-2);display:none;align-items:center;justify-content:center;font-size:12px;transition:.15s}
  .clear-btn:hover{background:var(--danger);color:#fff}
  .clear-btn.show{display:flex}
  .textarea-meta{display:flex;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}
  .textarea-meta.warn{color:var(--warn)}

  .selects-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  .select-field label{display:block;font-size:12px;font-weight:700;color:var(--txt-2);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
  .select-field .wrap{position:relative}
  .select-field i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--txt-2);font-size:14px;pointer-events:none;transition:.15s}
  select{
    width:100%;padding:14px 40px 14px 42px;
    background:rgba(0,0,0,.3);border:1px solid var(--border);
    border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--txt);
    appearance:none;-webkit-appearance:none;cursor:pointer;
    transition:all .2s;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 16px center;
  }
  select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--border-glow);background:rgba(0,0,0,.5)}
  select:focus + i, .select-field .wrap:focus-within i{color:var(--primary)}

  .actions-row{display:flex;gap:14px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:16px 28px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;
    letter-spacing:.2px;transition:all .2s;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{flex:1;min-width:200px;background:var(--grad);color:#fff;box-shadow:0 8px 24px -6px var(--primary-glow)}
  .btn-primary:hover{box-shadow:0 12px 32px -6px var(--primary-glow);transform:translateY(-2px)}
  .btn-primary.busy{pointer-events:none;opacity:.7;transform:none;box-shadow:none}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--txt)}
  .btn-ghost:hover{background:var(--surface-hover);border-color:var(--txt-2)}

  /* RESULT PLAYER */
  .result-panel{margin-top:24px;padding:20px;border-radius:var(--radius-sm);background:rgba(0,0,0,.2);border:1px solid var(--border);display:none}
  .result-panel.show{display:block;animation:slideUp .3s cubic-bezier(0.16, 1, 0.3, 1)}
  @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .result-head .label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--txt)}
  .result-head .label i{color:var(--primary)}
  .result-head .attr{font-size:12px;color:var(--muted);font-weight:600}
  
  .player{display:flex;align-items:center;gap:16px;background:var(--surface);padding:12px 18px;border-radius:16px;border:1px solid var(--border)}
  .play-toggle{width:48px;height:48px;border-radius:50%;flex-shrink:0;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 20px -5px var(--primary-glow);transition:.2s}
  .play-toggle:hover{transform:scale(1.05)}
  .play-toggle.playing{background:var(--success);box-shadow:0 0 20px -5px rgba(16,185,129,.5)}
  .player-info{flex:1;min-width:0}
  .player-info .seek{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:100px;background:var(--border);outline:none;cursor:pointer;margin-bottom:8px}
  .player-info .seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--txt);cursor:pointer;box-shadow:0 0 10px rgba(255,255,255,.5)}
  .player-info .seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:none;background:var(--txt);cursor:pointer}
  .player-times{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-2);font-weight:700;font-variant-numeric:tabular-nums}
  .dl-btn{width:48px;height:48px;border-radius:16px;flex-shrink:0;background:rgba(255,255,255,.05);color:var(--txt-2);display:flex;align-items:center;justify-content:center;font-size:18px;transition:.2s}
  .dl-btn:hover{background:var(--primary);color:#fff}

  /* SECTIONS */
  .panel{margin-bottom:36px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .panel-title{display:flex;align-items:center;gap:12px}
  .panel-title .icon{width:40px;height:40px;border-radius:12px;background:var(--surface-hover);color:var(--txt);display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid var(--border)}
  .panel-title h2{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .panel-title .count{font-size:13px;font-weight:800;color:var(--bg);background:var(--txt);padding:2px 10px;border-radius:100px;margin-left:4px}
  .btn-clear{font-size:13px;font-weight:700;color:var(--txt-2);display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:transparent;border:1px solid var(--border);transition:.2s}
  .btn-clear:hover{color:var(--danger);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.1)}

  .cards{display:flex;flex-direction:column;gap:14px}
  .empty-state{text-align:center;padding:50px 20px;background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius);color:var(--txt-2)}
  .empty-state i{font-size:40px;color:var(--border);margin-bottom:14px;display:block}
  .empty-state p{font-size:15px;font-weight:600}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;transition:.2s;animation:slideUp .2s}
  .card:hover{border-color:rgba(255,255,255,.15);box-shadow:0 8px 24px -6px rgba(0,0,0,.5);transform:translateY(-2px)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
  .card-text{font-size:15px;font-weight:600;color:var(--txt);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .card-time{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;flex-shrink:0;padding-top:2px}
  .card-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.05);color:var(--txt-2);border:1px solid rgba(255,255,255,.05)}
  .tag i{color:var(--primary)}
  .card-actions{display:flex;gap:10px;flex-wrap:wrap}
  .card-btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:10px 16px;border-radius:10px;transition:.15s}
  .cb-play{background:rgba(139,92,246,.15);color:#c4b5fd;border:1px solid rgba(139,92,246,.3)}
  .cb-play:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
  .cb-download,.cb-load{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--border)}
  .cb-download:hover,.cb-load:hover{background:rgba(255,255,255,.1);border-color:var(--txt-2)}
  .cb-delete{background:transparent;color:var(--muted);margin-left:auto}
  .cb-delete:hover{color:var(--danger);background:rgba(239,68,68,.1)}

  /* DOPE FOOTER */
  .dope-footer{
    margin-top:auto;
    padding:50px 20px 30px;
    text-align:center;
    position:relative;
    border-top:1px solid rgba(255,255,255,.05);
  }
  .dope-footer::before{
    content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);
    width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent);
    opacity:.5;
  }
  .footer-badge{
    display:inline-flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    padding:12px 24px;border-radius:100px;margin-bottom:20px;
    transition:.3s;
  }
  .footer-badge:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);transform:translateY(-2px)}
  .footer-badge span{font-size:14px;font-weight:600;color:var(--txt-2)}
  .footer-badge strong{font-size:15px;font-weight:800;color:var(--txt);letter-spacing:.3px}
  .footer-heart{color:var(--danger);animation:beat 1.5s infinite;display:inline-block;margin:0 4px}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  .footer-phone{
    display:inline-flex;align-items:center;gap:8px;
    font-size:15px;font-weight:800;color:var(--primary);
    background:rgba(139,92,246,.1);padding:8px 20px;border-radius:100px;
    border:1px solid rgba(139,92,246,.2);transition:.2s;
  }
  .footer-phone:hover{background:rgba(139,92,246,.2);color:#fff;box-shadow:0 0 20px -5px var(--primary-glow)}

  /* WHATSAPP FLOAT */
  .wa-float{
    position:fixed;bottom:30px;right:30px;z-index:1000;
    width:64px;height:64px;border-radius:50%;background:#25D366;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 28px -8px rgba(37,211,102,.5);
    transition:transform .3s cubic-bezier(0.175, 0.885, 0.32, 1.275),box-shadow .3s;
  }
  .wa-float::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(37,211,102,.3);animation:waPulse 2s infinite}
  @keyframes waPulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.3);opacity:0}}
  .wa-float:hover{transform:scale(1.1) rotate(8deg);box-shadow:0 16px 36px -8px rgba(37,211,102,.6)}
  .wa-float i{font-size:34px;color:#fff}

  /* TOASTS & SHIMMER */
  .toasts{position:fixed;top:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:12px;max-width:min(380px,calc(100vw - 40px))}
  .toast{display:flex;align-items:center;gap:12px;background:var(--surface-hover);border-radius:14px;padding:16px 20px;box-shadow:0 20px 40px -10px rgba(0,0,0,.6);border:1px solid var(--border);border-left:4px solid var(--primary);font-size:14px;font-weight:600;color:var(--txt);animation:toastIn .3s cubic-bezier(0.16, 1, 0.3, 1);will-change:transform,opacity}
  @keyframes toastIn{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
  .toast.out{animation:toastOut .3s forwards}
  @keyframes toastOut{to{opacity:0;transform:translateX(50px)}}
  .toast i{font-size:18px;flex-shrink:0}
  .toast.success{border-left-color:var(--success)}.toast.success i{color:var(--success)}
  .toast.error{border-left-color:var(--danger)}.toast.error i{color:var(--danger)}
  .toast.warn{border-left-color:var(--warn)}.toast.warn i{color:var(--warn)}
  .toast.info{border-left-color:var(--primary)}.toast.info i{color:var(--primary)}
  .shimmer{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-hover) 37%,var(--surface) 63%);background-size:400% 100%;animation:shimmer 1.2s ease infinite;border-radius:8px;color:transparent!important}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

  /* RESPONSIVE */
  @media (max-width:640px){
    body{padding:20px 16px 120px}
    .studio{padding:20px}
    .brand h1{font-size:22px}
    .selects-row{grid-template-columns:1fr}
    .btn-primary{min-width:0;width:100%}
    .actions-row .btn-ghost{width:100%}
    .wa-float{width:60px;height:60px;bottom:20px;right:20px}
    .wa-float i{font-size:30px}
    .result-head{gap:8px}
    .card-actions{gap:8px}
    .cb-delete{margin-left:0;width:100%;justify-content:center}
    .toasts{top:16px;right:16px;left:16px;max-width:none}
    .footer-badge{flex-direction:column;border-radius:20px;padding:16px 24px;gap:8px}
  }
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="logo"><i class="fas fa-wave-square"></i></div>
      <div>
        <h1>Dev Gift Voice</h1>
        <p>Premium Text to Speech Studio</p>
      </div>
    </div>
    <div class="pill"><span class="dot"></span> System Online</div>
  </header>

  <!-- STUDIO -->
  <section class="studio">
    <div class="section-label"><i class="fas fa-sparkles"></i> Create Audio</div>
    <div class="textarea-wrap">
      <textarea id="textInput" placeholder="Type or paste your text here… let's bring it to life." maxlength="2000"></textarea>
      <button class="clear-btn" id="clearBtn" title="Clear text"><i class="fas fa-times"></i></button>
      <div class="textarea-meta"><span id="charCount">0 / 2000</span></div>
    </div>

    <div class="selects-row">
      <div class="select-field">
        <label>Select Voice</label>
        <div class="wrap">
          <i class="fas fa-microphone-lines"></i>
          <select id="voiceSelect">
            <option value="woman1">Female Voice 1 (Smooth)</option>
            <option value="man1">Male Voice 1 (Deep)</option>
            <option value="woman2">Female Voice 2 (Bright)</option>
            <option value="man2">Male Voice 2 (Clear)</option>
          </select>
        </div>
      </div>
      <div class="select-field">
        <label>Language</label>
        <div class="wrap">
          <i class="fas fa-globe"></i>
          <select id="langSelect">
            <option value="English">English</option>
            <option value="French">French</option>
            <option value="Spanish">Spanish</option>
            <option value="German">German</option>
            <option value="Hausa">Hausa</option>
            <option value="Yoruba">Yoruba</option>
            <option value="Igbo">Igbo</option>
            <option value="Arabic">Arabic</option>
          </select>
        </div>
      </div>
    </div>

    <div class="actions-row">
      <button class="btn btn-primary" id="generateBtn">
        <i class="fas fa-bolt"></i> Generate Speech
      </button>
      <button class="btn btn-ghost" id="saveBtn">
        <i class="fas fa-bookmark"></i> Save Text
      </button>
    </div>

    <!-- RESULT PLAYER -->
    <div class="result-panel" id="resultPanel">
      <div class="result-head">
        <div class="label"><i class="fas fa-volume-high"></i> Playing Audio</div>
        <div class="attr">Powered by Dev Gift</div>
      </div>
      <div class="player">
        <button class="play-toggle" id="playToggle"><i class="fas fa-play"></i></button>
        <div class="player-info">
          <input type="range" class="seek" id="seekBar" min="0" max="100" value="0" step="0.1">
          <div class="player-times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
        </div>
        <button class="dl-btn" id="dlBtn" title="Download"><i class="fas fa-download"></i></button>
      </div>
    </div>
  </section>

  <!-- SAVED -->
  <section class="panel" id="savedPanel">
    <div class="panel-head">
      <div class="panel-title">
        <div class="icon"><i class="fas fa-bookmark"></i></div>
        <h2>Saved Drafts</h2>
        <span class="count" id="savedCount">0</span>
      </div>
    </div>
    <div class="cards" id="savedCards"></div>
  </section>

  <!-- HISTORY -->
  <section class="panel" id="historyPanel">
    <div class="panel-head">
      <div class="panel-title">
        <div class="icon"><i class="fas fa-clock-rotate-left"></i></div>
        <h2>Recent History</h2>
        <span class="count" id="historyCount">0</span>
      </div>
      <button class="btn-clear" id="clearAllBtn">
        <i class="fas fa-trash-can"></i> Clear All
      </button>
    </div>
    <div class="cards" id="historyCards"></div>
  </section>

  <!-- DOPE FOOTER -->
  <footer class="dope-footer">
    <div class="footer-badge">
      <span>Crafted with <span class="footer-heart">❤️</span> by</span>
      <strong>Dev Gift</strong>
    </div>
    <br>
    <a href="tel:09164624021" class="footer-phone">
      <i class="fas fa-phone-volume"></i> 0916 462 4021
    </a>
  </footer>
</div>

<!-- WHATSAPP -->
<a class="wa-float" href="https://wa.me/2349164624021" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <i class="fab fa-whatsapp"></i>
</a>

<!-- TOASTS -->
<div class="toasts" id="toasts"></div>

<script>
/* ============================================================
   CONSTANTS & DOM
   ============================================================ */
const LS_HISTORY = 'devgift_history_v1';
const LS_SAVED   = 'devgift_saved_v1';
const LS_PREFS   = 'devgift_prefs_v1';
const MAX_HISTORY = 30;
const MAX_SAVED   = 50;

const $ = (id) => document.getElementById(id);
const textInput = $('textInput'), clearBtn = $('clearBtn'), charCount = $('charCount');
const voiceSelect = $('voiceSelect'), langSelect = $('langSelect');
const generateBtn = $('generateBtn'), saveBtn = $('saveBtn');
const resultPanel = $('resultPanel'), playToggle = $('playToggle'), seekBar = $('seekBar');
const curTime = $('curTime'), durTime = $('durTime'), dlBtn = $('dlBtn');
const savedCards = $('savedCards'), savedCount = $('savedCount');
const historyCards = $('historyCards'), historyCount = $('historyCount');
const clearAllBtn = $('clearAllBtn'), toasts = $('toasts');

let currentAudio = null, currentItem = null, history = [], saved = [];

/* ============================================================
   HELPERS
   ============================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(iso){
  const then = new Date(iso).getTime();
  if (isNaN(then)) return '';
  const diff = Math.floor((Date.now() - then) / 1000);
  if (diff < 10) return 'just now';
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}
function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  return Math.floor(sec/60) + ':' + String(Math.floor(sec%60)).padStart(2,'0');
}
function showToast(msg, type = 'info'){
  const icons = { success:'fa-circle-check', error:'fa-circle-exclamation', warn:'fa-triangle-exclamation', info:'fa-circle-info' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(msg)}</span>`;
  toasts.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3000);
}

/* ============================================================
   STORAGE
   ============================================================ */
function loadHistory(){ try { history = JSON.parse(localStorage.getItem(LS_HISTORY) || '[]'); } catch { history = []; } if (!Array.isArray(history)) history = []; }
function persistHistory(){ try { localStorage.setItem(LS_HISTORY, JSON.stringify(history)); } catch {} if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY); }
function loadSaved(){ try { saved = JSON.parse(localStorage.getItem(LS_SAVED) || '[]'); } catch { saved = []; } if (!Array.isArray(saved)) saved = []; }
function persistSaved(){ try { localStorage.setItem(LS_SAVED, JSON.stringify(saved)); } catch {} if (saved.length > MAX_SAVED) saved = saved.slice(0, MAX_SAVED); }
function savePrefs(){ try { localStorage.setItem(LS_PREFS, JSON.stringify({ voice: voiceSelect.value, language: langSelect.value })); } catch {} }
function loadPrefs(){ try { const p = JSON.parse(localStorage.getItem(LS_PREFS) || '{}'); if (p.voice) voiceSelect.value = p.voice; if (p.language) langSelect.value = p.language; } catch {} }

/* ============================================================
   RENDER
   ============================================================ */
function renderHistory(){
  historyCount.textContent = history.length;
  clearAllBtn.style.display = history.length ? 'flex' : 'none';
  if (!history.length){ historyCards.innerHTML = `<div class="empty-state"><i class="fas fa-headphones"></i><p>Your generated audio will appear here.</p></div>`; return; }
  historyCards.innerHTML = history.map(item => `
    <div class="card" data-id="${item.id}">
      <div class="card-top"><div class="card-text">${escapeHtml(item.text)}</div><div class="card-time">${timeAgo(item.timestamp)}</div></div>
      <div class="card-meta"><span class="tag"><i class="fas fa-microphone"></i>${escapeHtml(item.voice)}</span><span class="tag"><i class="fas fa-globe"></i>${escapeHtml(item.language)}</span></div>
      <div class="card-actions">
        <button class="card-btn cb-play" data-act="play" data-id="${item.id}"><i class="fas fa-play"></i> Play</button>
        <button class="card-btn cb-download" data-act="download" data-id="${item.id}"><i class="fas fa-download"></i> Download</button>
        <button class="card-btn cb-delete" data-act="delete" data-id="${item.id}"><i class="fas fa-trash-can"></i> Delete</button>
      </div>
    </div>`).join('');
}
function renderSaved(){
  savedCount.textContent = saved.length;
  if (!saved.length){ savedCards.innerHTML = `<div class="empty-state"><i class="fas fa-bookmark"></i><p>Save text drafts to generate them later.</p></div>`; return; }
  savedCards.innerHTML = saved.map(item => `
    <div class="card" data-id="${item.id}">
      <div class="card-top"><div class="card-text">${escapeHtml(item.text)}</div><div class="card-time">${timeAgo(item.timestamp)}</div></div>
      <div class="card-meta"><span class="tag"><i class="fas fa-microphone"></i>${escapeHtml(item.voice)}</span><span class="tag"><i class="fas fa-globe"></i>${escapeHtml(item.language)}</span></div>
      <div class="card-actions">
        <button class="card-btn cb-play" data-sact="generate" data-id="${item.id}"><i class="fas fa-bolt"></i> Generate Now</button>
        <button class="card-btn cb-load" data-sact="load" data-id="${item.id}"><i class="fas fa-pen"></i> Edit</button>
        <button class="card-btn cb-delete" data-sact="delete" data-id="${item.id}"><i class="fas fa-trash-can"></i> Delete</button>
      </div>
    </div>`).join('');
}

/* ============================================================
   INPUT & PLAYER
   ============================================================ */
function updateCharCount(){
  const len = textInput.value.length;
  charCount.textContent = `${len} / 2000`;
  charCount.parentElement.classList.toggle('warn', len > 1800);
  clearBtn.classList.toggle('show', len > 0);
}
textInput.addEventListener('input', updateCharCount);
clearBtn.addEventListener('click', () => { textInput.value = ''; updateCharCount(); textInput.focus(); });

function setupAudio(url){
  if (currentAudio){ currentAudio.pause(); currentAudio.src = ''; }
  currentAudio = new Audio(url);
  currentAudio.preload = 'auto';
  currentAudio.addEventListener('loadedmetadata', () => { durTime.textContent = fmtTime(currentAudio.duration); });
  currentAudio.addEventListener('timeupdate', () => {
    if (currentAudio.duration){ seekBar.value = (currentAudio.currentTime / currentAudio.duration) * 100; curTime.textContent = fmtTime(currentAudio.currentTime); }
  });
  currentAudio.addEventListener('ended', () => { playToggle.classList.remove('playing'); playToggle.innerHTML = '<i class="fas fa-play"></i>'; seekBar.value = 0; curTime.textContent = '0:00'; });
  currentAudio.addEventListener('play', () => { playToggle.classList.add('playing'); playToggle.innerHTML = '<i class="fas fa-pause"></i>'; });
  currentAudio.addEventListener('pause', () => { playToggle.classList.remove('playing'); playToggle.innerHTML = '<i class="fas fa-play"></i>'; });
}
playToggle.addEventListener('click', () => {
  if (!currentAudio) return;
  if (currentAudio.paused) currentAudio.play().catch(() => showToast('Tap play again', 'warn'));
  else currentAudio.pause();
});
seekBar.addEventListener('input', () => { if (currentAudio && currentAudio.duration) currentAudio.currentTime = (seekBar.value / 100) * currentAudio.duration; });
dlBtn.addEventListener('click', () => { if (currentItem) downloadAudio(currentItem.audio, `devgift-${currentItem.id}.mp3`); });

/* ============================================================
   DOWNLOAD
   ============================================================ */
async function downloadAudio(url, filename){
  try {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = objUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(objUrl);
    showToast('⬇ Download started', 'success');
  } catch { window.open(url, '_blank'); showToast('Opened audio — long-press to save', 'info'); }
}

/* ============================================================
   GENERATE (CALLS BACKEND)
   ============================================================ */
async function generateSpeech(opts = {}){
  const text = (opts.text !== undefined ? opts.text : textInput.value).trim();
  const voice = opts.voice || voiceSelect.value;
  const language = opts.language || langSelect.value;

  if (!text){ showToast('Type something first ✍️', 'warn'); textInput.focus(); return; }

  generateBtn.classList.add('busy');
  generateBtn.innerHTML = '<i class="fas fa-bolt"></i> Generating…';
  showToast('⚡ Generating…', 'info');

  resultPanel.classList.add('show');
  playToggle.classList.add('shimmer'); playToggle.innerHTML = '';
  seekBar.classList.add('shimmer'); seekBar.value = 0;
  curTime.textContent = '0:00'; durTime.textContent = '0:00';

  const url = `/api/generate?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(voice)}&language=${encodeURIComponent(language)}`;

  let data;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Network error');
    data = await res.json();
    if (!data || data.success !== true) throw new Error((data && data.message) || 'Generation failed');
    if (!data.audio) throw new Error('No audio returned');
  } catch (err) {
    resultPanel.classList.remove('show');
    playToggle.classList.remove('shimmer'); seekBar.classList.remove('shimmer');
    generateBtn.classList.remove('busy');
    generateBtn.innerHTML = '<i class="fas fa-bolt"></i> Generate Speech';
    showToast('❌ ' + (err.message || 'Failed'), 'error');
    return;
  }

  playToggle.classList.remove('shimmer'); seekBar.classList.remove('shimmer');
  const item = { id: uid(), text: data.text || text, voice: data.voice || voice, language: data.language || language, audio: data.audio, timestamp: data.timestamp || new Date().toISOString() };
  currentItem = item;
  setupAudio(item.audio);

  try { await currentAudio.play(); showToast('🎵 Playing · Saved', 'success'); }
  catch { window.open(item.audio, '_blank'); showToast('🎵 Opened in new tab', 'success'); }

  history.unshift(item);
  if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  persistHistory(); renderHistory();

  voiceSelect.value = item.voice; langSelect.value = item.language; savePrefs();

  generateBtn.classList.remove('busy');
  generateBtn.innerHTML = '<i class="fas fa-bolt"></i> Generate Speech';
}

generateBtn.addEventListener('click', () => generateSpeech());

/* ============================================================
   SAVE FOR LATER
   ============================================================ */
saveBtn.addEventListener('click', () => {
  const text = textInput.value.trim();
  if (!text){ showToast('Type something to save ✍️', 'warn'); textInput.focus(); return; }
  saved.unshift({ id: uid(), text, voice: voiceSelect.value, language: langSelect.value, timestamp: new Date().toISOString() });
  if (saved.length > MAX_SAVED) saved = saved.slice(0, MAX_SAVED);
  persistSaved(); renderSaved(); showToast('💾 Saved to drafts', 'success');
});

/* ============================================================
   CARD ACTIONS
   ============================================================ */
historyCards.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  const item = history.find(x => x.id === id); if (!item) return;

  if (act === 'play'){
    if (currentItem && currentItem.audio === item.audio && currentAudio){ currentAudio.currentTime = 0; currentAudio.play().catch(() => window.open(item.audio, '_blank')); }
    else { currentItem = item; resultPanel.classList.add('show'); setupAudio(item.audio); currentAudio.play().catch(() => window.open(item.audio, '_blank')); }
    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (act === 'download') downloadAudio(item.audio, `devgift-${item.id}.mp3`);
  if (act === 'delete'){
    if (!confirm('Delete this audio?')) return;
    history = history.filter(x => x.id !== id); persistHistory(); renderHistory(); showToast('🗑 Deleted', 'info');
  }
});

clearAllBtn.addEventListener('click', () => {
  if (!history.length) return;
  if (!confirm('Delete ALL history?')) return;
  history = []; persistHistory(); renderHistory(); showToast('History cleared', 'info');
});

savedCards.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-sact]'); if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.sact;
  const item = saved.find(x => x.id === id); if (!item) return;

  if (act === 'generate'){
    textInput.value = item.text; voiceSelect.value = item.voice; langSelect.value = item.language; updateCharCount();
    generateSpeech({ text: item.text, voice: item.voice, language: item.language });
  }
  if (act === 'load'){
    textInput.value = item.text; voiceSelect.value = item.voice; langSelect.value = item.language; updateCharCount();
    textInput.focus(); textInput.scrollIntoView({ behavior: 'smooth', block: 'center' }); showToast('Loaded into editor', 'info');
  }
  if (act === 'delete'){
    if (!confirm('Delete this draft?')) return;
    saved = saved.filter(x => x.id !== id); persistSaved(); renderSaved(); showToast('🗑 Draft deleted', 'info');
  }
});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  loadPrefs(); loadHistory(); loadSaved(); renderHistory(); renderSaved(); updateCharCount();
  voiceSelect.addEventListener('change', savePrefs);
  langSelect.addEventListener('change', savePrefs);
  textInput.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); generateSpeech(); } });
}
init();
</script>
</body>
</html>
