<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Gift Voice · Enterprise Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root[data-theme="light"] {
    --bg: #f8fafc; --bg-gradient: radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, transparent 50%);
    --surface: rgba(255, 255, 255, 0.7); --surface-solid: #ffffff; --border: rgba(0, 0, 0, 0.06); --border-hover: rgba(0, 0, 0, 0.12);
    --txt: #0f172a; --txt-2: #475569; --muted: #94a3b8; --primary: #3b82f6; --primary-glow: rgba(59, 130, 246, 0.3); --accent: #8b5cf6;
    --grad: linear-gradient(135deg, #3b82f6, #8b5cf6); --shadow: 0 8px 32px rgba(0, 0, 0, 0.04); --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.1);
    --skeleton: #e2e8f0; --skeleton-shine: #f1f5f9;
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --bg-gradient: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%);
    --surface: rgba(30, 41, 59, 0.6); --surface-solid: #1e293b; --border: rgba(255, 255, 255, 0.08); --border-hover: rgba(255, 255, 255, 0.15);
    --txt: #f8fafc; --txt-2: #cbd5e1; --muted: #64748b; --primary: #60a5fa; --primary-glow: rgba(96, 165, 250, 0.3); --accent: #a78bfa;
    --grad: linear-gradient(135deg, #60a5fa, #a78bfa); --shadow: 0 8px 32px rgba(0, 0, 0, 0.2); --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.4);
    --skeleton: #1e293b; --skeleton-shine: #334155;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); background-image: var(--bg-gradient); color: var(--txt); min-height: 100vh; display: flex; flex-direction: column; padding: 24px; -webkit-font-smoothing: antialiased; transition: background-color 0.4s ease, color 0.4s ease; }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
  input,select,textarea{font-family:inherit;color:inherit;outline:none}
  a{color:inherit;text-decoration:none}
  .app-container { max-width: 1100px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }

  /* HEADER */
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; margin-bottom: 32px; background: var(--surface); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); transition: all 0.4s ease; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--grad); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 16px -4px var(--primary-glow); color: white; font-size: 20px; transition: transform 0.3s ease; }
  .brand:hover .logo { transform: rotate(-10deg) scale(1.05); }
  .brand-text h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .brand-text p { font-size: 12px; color: var(--txt-2); font-weight: 500; margin-top: 2px; }
  .header-actions { display: flex; align-items: center; gap: 16px; }
  .theme-toggle { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-solid); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--txt-2); transition: all 0.3s ease; box-shadow: var(--shadow); }
  .theme-toggle:hover { color: var(--primary); border-color: var(--primary); transform: scale(1.05); }
  .status-badge { display: flex; align-items: center; gap: 8px; background: var(--surface-solid); border: 1px solid var(--border); padding: 8px 16px; border-radius: 100px; font-size: 12px; font-weight: 700; color: var(--txt-2); box-shadow: var(--shadow); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.6); }

  /* STUDIO CARD */
  .studio-card { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 32px; box-shadow: var(--shadow-lg); margin-bottom: 32px; transition: all 0.4s ease; }
  .input-group { margin-bottom: 24px; position: relative; }
  .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--txt-2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  textarea { width: 100%; min-height: 160px; resize: vertical; padding: 20px; border-radius: 16px; background: var(--surface-solid); border: 1px solid var(--border); font-size: 16px; line-height: 1.6; color: var(--txt); transition: all 0.3s ease; box-shadow: var(--shadow); }
  textarea::placeholder { color: var(--muted); }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
  .char-counter { position: absolute; bottom: 16px; right: 20px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-solid); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); }

  .grid-2 { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
  .select-box label { display: block; font-size: 13px; font-weight: 700; color: var(--txt-2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  
  /* CUSTOM SELECT */
  .select-wrapper { position: relative; }
  .select-wrapper > i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; z-index: 2; }
  .custom-select-btn { width: 100%; padding: 16px 16px 16px 44px; text-align: left; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 14px; font-size: 15px; font-weight: 600; color: var(--txt); cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; }
  .custom-select-btn:focus, .custom-select-btn.active { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
  .custom-select-btn .fa-chevron-down { font-size: 12px; color: var(--muted); transition: transform 0.3s; }
  .custom-select-btn.active .fa-chevron-down { transform: rotate(180deg); }
  
  .custom-dropdown { position: absolute; top: calc(100% + 8px); left: 0; width: 100%; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 100; display: none; flex-direction: column; overflow: hidden; animation: dropIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  .custom-dropdown.show { display: flex; }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .dropdown-search { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .dropdown-search i { color: var(--muted); font-size: 14px; }
  .dropdown-search input { width: 100%; border: none; background: transparent; font-size: 14px; font-weight: 500; color: var(--txt); }
  .dropdown-list { max-height: 280px; overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .dropdown-list::-webkit-scrollbar { width: 6px; }
  .dropdown-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  .dropdown-item { padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--txt); cursor: pointer; transition: all 0.1s ease; display: flex; align-items: center; justify-content: space-between; }
  .dropdown-item:hover, .dropdown-item.selected { background: var(--border); }
  .dropdown-item.selected::after { content: '\f00c'; font-family: 'FontAwesome'; color: var(--primary); font-size: 12px; }
  .dropdown-empty { padding: 16px; text-align: center; font-size: 13px; color: var(--muted); font-weight: 500; }

  .action-row { display: flex; gap: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 28px; border-radius: 14px; font-size: 15px; font-weight: 700; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { flex: 1; background: var(--grad); color: white; box-shadow: 0 8px 24px -6px var(--primary-glow); }
  .btn-primary:hover { box-shadow: 0 12px 32px -6px var(--primary-glow); transform: translateY(-2px); }
  .btn-ghost { background: var(--surface-solid); border: 1px solid var(--border); color: var(--txt); box-shadow: var(--shadow); }
  .btn-ghost:hover { background: var(--border); border-color: var(--border-hover); }

  /* LOADING */
  .btn-primary.loading { color: transparent; pointer-events: none; animation: morphing 2s infinite linear; }
  .btn-primary.loading::after { content: ''; position: absolute; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes morphing { 0% { box-shadow: 0 0 0 0 var(--primary-glow); } 50% { box-shadow: 0 0 30px 10px var(--primary-glow); } 100% { box-shadow: 0 0 0 0 var(--primary-glow); } }

  /* PLAYER */
  .result-panel { margin-top: 24px; border-radius: 16px; background: var(--surface-solid); border: 1px solid var(--border); box-shadow: var(--shadow); display: none; overflow: hidden; }
  .result-panel.show { display: block; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .player-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .player-header span { font-size: 13px; font-weight: 700; color: var(--txt-2); text-transform: uppercase; letter-spacing: 0.5px; }
  .player-body { padding: 20px; display: flex; align-items: center; gap: 16px; }
  .play-btn { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; background: var(--grad); color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 8px 16px -4px var(--primary-glow); transition: all 0.2s ease; }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn.playing { background: #10b981; box-shadow: 0 8px 16px -4px rgba(16,185,129,0.4); }
  .progress-container { flex: 1; }
  .seek-bar { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 100px; background: var(--border); outline: none; cursor: pointer; margin-bottom: 8px; }
  .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 0 10px var(--primary-glow); transition: transform 0.1s ease; }
  .time-stamps { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .download-btn { width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); color: var(--txt-2); display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s ease; }
  .download-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

  /* SKELETON */
  .skeleton-box { display: none; padding: 20px; align-items: center; gap: 16px; }
  .result-panel.loading .skeleton-box { display: flex; }
  .result-panel.loading .player-body { display: none; }
  .skeleton-circle { width: 48px; height: 48px; border-radius: 50%; background: var(--skeleton); flex-shrink: 0; position: relative; overflow: hidden; }
  .skeleton-lines { flex: 1; }
  .skeleton-line { height: 12px; border-radius: 4px; background: var(--skeleton); margin-bottom: 10px; position: relative; overflow: hidden; }
  .skeleton-line.short { width: 60%; }
  .skeleton-circle::after, .skeleton-line::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent); animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  /* SECTIONS */
  .section-container { margin-bottom: 40px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .section-title { display: flex; align-items: center; gap: 12px; }
  .section-title h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .count-badge { background: var(--primary); color: white; font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 100px; }
  .cards-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .empty-state { text-align: center; padding: 40px; background: var(--surface); border: 2px dashed var(--border); border-radius: 20px; color: var(--muted); }
  .empty-state i { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 14px; font-weight: 500; }
  .glass-card { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); transition: all 0.3s ease; animation: slideUp 0.3s ease; display: flex; flex-direction: column; gap: 16px; }
  .glass-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .card-text { font-size: 15px; font-weight: 600; color: var(--txt); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-time { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .card-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; background: var(--surface-solid); border: 1px solid var(--border); padding: 4px 10px; border-radius: 100px; color: var(--txt-2); }
  .card-actions { display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 16px; }
  .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 8px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease; }
  .btn-sm-primary { background: var(--primary); color: white; }
  .btn-sm-primary:hover { background: var(--accent); }
  .btn-sm-ghost { background: var(--surface-solid); border: 1px solid var(--border); color: var(--txt-2); }
  .btn-sm-ghost:hover { background: var(--border); color: var(--txt); }
  .btn-sm-danger { background: transparent; color: #ef4444; margin-left: auto; }
  .btn-sm-danger:hover { background: rgba(239, 68, 68, 0.1); }

  /* FOOTER */
  .company-footer { margin-top: auto; padding: 30px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; background: var(--surface); backdrop-filter: blur(12px); border-radius: 20px; box-shadow: var(--shadow); }
  .footer-left { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--txt-2); font-weight: 500; }
  .footer-left strong { color: var(--txt); font-weight: 700; }
  .footer-right { display: flex; align-items: center; gap: 16px; }
  .footer-link { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--primary); padding: 8px 16px; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 100px; transition: all 0.2s ease; box-shadow: var(--shadow); }
  .footer-link:hover { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

  /* WHATSAPP */
  .wa-float { position: fixed; bottom: 30px; right: 30px; z-index: 1000; width: 60px; height: 60px; border-radius: 50%; background: #25D366; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 24px -6px rgba(37,211,102,0.5); color: white; font-size: 30px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .wa-float:hover { transform: scale(1.1) rotate(10deg); box-shadow: 0 16px 32px -6px rgba(37,211,102,0.6); }

  /* TOASTS */
  .toasts { position: fixed; top: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 12px; }
  .toast { display: flex; align-items: center; gap: 12px; background: var(--surface-solid); padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 600; animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
  .toast.out { animation: toastOut 0.3s forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateX(50px); } }

  @media (max-width: 768px) {
    .action-row { flex-direction: column; }
    .btn-ghost { width: 100%; }
    .company-footer { flex-direction: column; text-align: center; justify-content: center; }
    .footer-right { flex-direction: column; width: 100%; }
    .footer-link { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand">
      <div class="logo"><i class="fas fa-waveform"></i></div>
      <div class="brand-text">
        <h1>Dev Gift Voice</h1>

    <div class="header-actions">
      <div class="status-badge"><div class="status-dot"></div> All Systems Operational</div>
      <button class="theme-toggle" id="themeToggle" title="Toggle Theme"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <main class="studio-card">
    <div class="input-group">
      <label>Input Text</label>
      <textarea id="textInput" placeholder="Enter the text you want to synthesize into high-quality audio..." maxlength="2000"></textarea>
      <div class="char-counter"><span id="charCount">0</span> / 2000</div>
    </div>

    <!-- VOICE SELECT ONLY (No Language) -->
    <div class="grid-2">
      <div class="select-box">
        <label>Voice Model</label>
        <div class="select-wrapper">
          <i class="fas fa-microphone-lines"></i>
          <div class="custom-select-btn" id="voiceSelectBtn">
            <span id="voiceSelectedText">Select Voice...</span>
            <i class="fas fa-chevron-down"></i>

          <div class="custom-dropdown" id="voiceDropdown">

              <input type="text" id="voiceSearch" placeholder="Search 40+ voices..." autocomplete="off">

    <div class="action-row">

        <span style="color: var(--primary);">Dev Gift Engine</span>
      </div>
      
      <!-- Skeleton Loader -->
      <div class="skeleton-box">
        <div class="skeleton-circle"></div>
        <div class="skeleton-lines">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>

      </div>

      <!-- Real Player -->
      <div class="player-body">
        <button class="play-btn" id="playToggle"><i class="fas fa-play"></i></button>
        <div class="progress-container">
          <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0" step="0.1">

  <section class="section-container" id="historyPanel">

  <footer class="company-footer">

      <i class="fas fa-copyright" style="color: var(--muted);"></i> 2026 <strong>Dev Gift</strong>. All rights reserved.
    </div>
    <div class="footer-right">
      <span style="font-size: 14px; color: var(--muted);">Contact Support:</span>
      <a href="tel:09164624021" class="footer-link">
        <i class="fas fa-phone-volume"></i> 0916 462 4021

<script>
/* ============================================================
   THEME MANAGER
   ============================================================ */
const themeToggle = document.getElementById('themeToggle');
const htmlEl = document.documentElement;
const savedTheme = localStorage.getItem('devgift_theme') || 'light';
htmlEl.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = htmlEl.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  htmlEl.setAttribute('data-theme', next);
  localStorage.setItem('devgift_theme', next);
  updateThemeIcon(next);
});

function updateThemeIcon(theme) {
  themeToggle.innerHTML = theme === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
}

/* ============================================================
   MASTER VOICE LIST (From your screenshots)
   ============================================================ */
const VOICES = [
  "FUSSY MALE", "JOSY", "CUTE BOY", "MALE PROFESSOR", "MALE SCIENTIST", "NORMAL MALE", 
  "BRITISH MALE", "AMERICAN MALE", "MALE STORYTELLER", "CHARMING MALE", "CONFIDENT MALE", 
  "ENERGETIC MALE", "SERIOUS MALE", "MODERN BLOGGER", "ALFRED", "GOOD GUY", "QUEEN", 
  "FEMALE VOCALIST", "BRITISH FEMALE", "AMERICAN FEMALE", "FEMALE STORYTELLER", 
  "NARRATIVE FEMALE", "CHARMING FEMALE", "SERIOUS FEMALE", "ENERGETIC FEMALE", 
  "EMPATHETIC FEMALE", "CHILL GIRL", "JESSIE FEMALE", "ADORABLE GIRL", "COTTAGECORE", 
  "COZY", "OPERA", "OPEN MIC", "QUIRKY TIME", "CLASSIC ELECTRIC", "POP LULLABY", 
  "EUPHORIC", "KAWAII VOCALIST", "KIDS VOCALIST", "WACKY", "BESTIE", "ELFY", "SANTA III"
];

/* ============================================================
   DOM ELEMENTS
   ============================================================ */
const $ = (id) => document.getElementById(id);
const textInput = $('textInput'), charCount = $('charCount');
const voiceSelectBtn = $('voiceSelectBtn'), voiceDropdown = $('voiceDropdown'), voiceSearch = $('voiceSearch'), voiceList = $('voiceList'), voiceSelectedText = $('voiceSelectedText'), voiceValue = $('voiceValue');
const generateBtn = $('generateBtn'), saveBtn = $('saveBtn');
const resultPanel = $('resultPanel'), playToggle = $('playToggle'), seekBar = $('seekBar');
const curTime = $('curTime'), durTime = $('durTime'), dlBtn = $('dlBtn');
const savedCards = $('savedCards'), savedCount = $('savedCount');
const historyCards = $('historyCards'), historyCount = $('historyCount');
const clearAllBtn = $('clearAllBtn'), toasts = $('toasts');

const LS_HISTORY = 'devgift_history_v3';
const LS_SAVED   = 'devgift_saved_v3';
let currentAudio = null, currentItem = null, history = [], saved = [];

/* ============================================================
   HELPERS
   ============================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(iso){
  const then = new Date(iso).getTime();
  if (isNaN(then)) return '';
  const diff = Math.floor((Date.now() - then) / 1000);
  if (diff < 10) return 'just now';
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}
function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  return Math.floor(sec/60) + ':' + String(Math.floor(sec%60)).padStart(2,'0');
}
function showToast(msg, type = 'info'){
  const icons = { success:'fa-circle-check', error:'fa-circle-exclamation', warn:'fa-triangle-exclamation', info:'fa-circle-info' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(msg)}</span>`;
  toasts.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3000);
}

/* ============================================================
   CUSTOM DROPDOWN LOGIC
   ============================================================ */
function renderVoiceList(filter = "") {
  const filtered = VOICES.filter(v => v.toLowerCase().includes(filter.toLowerCase()));
  if (filtered.length === 0) {
    voiceList.innerHTML = `<div class="dropdown-empty">No voices found</div>`;
    return;
  }
  voiceList.innerHTML = filtered.map(v => `
    <div class="dropdown-item ${v === voiceValue.value ? 'selected' : ''}" data-voice="${v}">
      ${v}
    </div>
  `).join('');
}

voiceSelectBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  voiceDropdown.classList.toggle('show');
  voiceSelectBtn.classList.toggle('active');
  if (voiceDropdown.classList.contains('show')) {
    voiceSearch.value = '';
    renderVoiceList();
    voiceSearch.focus();
  }
});

document.addEventListener('click', (e) => {
  if (!voiceSelectBtn.contains(e.target) && !voiceDropdown.contains(e.target)) {
    voiceDropdown.classList.remove('show');
    voiceSelectBtn.classList.remove('active');
  }
});

voiceSearch.addEventListener('input', (e) => renderVoiceList(e.target.value));

voiceList.addEventListener('click', (e) => {
  const item = e.target.closest('.dropdown-item');
  if (!item) return;
  const selected = item.dataset.voice;
  voiceValue.value = selected;
  voiceSelectedText.textContent = selected;
  voiceDropdown.classList.remove('show');
  voiceSelectBtn.classList.remove('active');
});

/* ============================================================
   STORAGE & RENDER
   ============================================================ */
function loadHistory(){ try { history = JSON.parse(localStorage.getItem(LS_HISTORY) || '[]'); } catch { history = []; } }
function persistHistory(){ try { localStorage.setItem(LS_HISTORY, JSON.stringify(history)); } catch {} }
function loadSaved(){ try { saved = JSON.parse(localStorage.getItem(LS_SAVED) || '[]'); } catch { saved = []; } }
function persistSaved(){ try { localStorage.setItem(LS_SAVED, JSON.stringify(saved)); } catch {} }

function renderHistory(){
  historyCount.textContent = history.length;
  if (!history.length){ historyCards.innerHTML = `<div class="empty-state"><i class="fas fa-headphones"></i><p>Your generated audio will appear here.</p></div>`; return; }
  historyCards.innerHTML = history.map(item => `
    <div class="glass-card">
      <div class="card-header">
        <div class="card-text">${escapeHtml(item.text)}</div>
        <div class="card-time">${timeAgo(item.timestamp)}</div>
      </div>
      <div class="card-tags">
        <span class="tag"><i class="fas fa-microphone"></i> ${escapeHtml(item.voice)}</span>
      </div>
      <div class="card-actions">
        <button class="btn-sm btn-sm-primary" data-act="play" data-id="${item.id}"><i class="fas fa-play"></i> Play</button>
        <button class="btn-sm btn-sm-ghost" data-act="download" data-id="${item.id}"><i class="fas fa-download"></i> Download</button>
        <button class="btn-sm btn-sm-danger" data-act="delete" data-id="${item.id}"><i class="fas fa-trash"></i> Delete</button>
      </div>
    </div>`).join('');
}

function renderSaved(){
  savedCount.textContent = saved.length;
  if (!saved.length){ savedCards.innerHTML = `<div class="empty-state"><i class="fas fa-bookmark"></i><p>Save text drafts to generate them later.</p></div>`; return; }
  savedCards.innerHTML = saved.map(item => `
    <div class="glass-card">
      <div class="card-header">
        <div class="card-text">${escapeHtml(item.text)}</div>
        <div class="card-time">${timeAgo(item.timestamp)}</div>
      </div>
      <div class="card-tags">
        <span class="tag"><i class="fas fa-microphone"></i> ${escapeHtml(item.voice)}</span>
      </div>
      <div class="card-actions">
        <button class="btn-sm btn-sm-primary" data-sact="generate" data-id="${item.id}"><i class="fas fa-bolt"></i> Generate</button>
        <button class="btn-sm btn-sm-ghost" data-sact="load" data-id="${item.id}"><i class="fas fa-pen"></i> Edit</button>
        <button class="btn-sm btn-sm-danger" data-sact="delete" data-id="${item.id}"><i class="fas fa-trash"></i> Delete</button>
      </div>
    </div>`).join('');
}

/* ============================================================
   INPUT & PLAYER
   ============================================================ */
textInput.addEventListener('input', () => { charCount.textContent = textInput.value.length; });

function setupAudio(url){
  if (currentAudio){ currentAudio.pause(); currentAudio.src = ''; }
  currentAudio = new Audio(url);
  currentAudio.preload = 'auto';
  currentAudio.addEventListener('loadedmetadata', () => { durTime.textContent = fmtTime(currentAudio.duration); });
  currentAudio.addEventListener('timeupdate', () => {
    if (currentAudio.duration){ seekBar.value = (currentAudio.currentTime / currentAudio.duration) * 100; curTime.textContent = fmtTime(currentAudio.currentTime); }
  });
  currentAudio.addEventListener('ended', () => { playToggle.classList.remove('playing'); playToggle.innerHTML = '<i class="fas fa-play"></i>'; seekBar.value = 0; curTime.textContent = '0:00'; });
  currentAudio.addEventListener('play', () => { playToggle.classList.add('playing'); playToggle.innerHTML = '<i class="fas fa-pause"></i>'; });
  currentAudio.addEventListener('pause', () => { playToggle.classList.remove('playing'); playToggle.innerHTML = '<i class="fas fa-play"></i>'; });
}
playToggle.addEventListener('click', () => {
  if (!currentAudio) return;
  if (currentAudio.paused) currentAudio.play().catch(() => showToast('Tap play again', 'warn'));
  else currentAudio.pause();
});
seekBar.addEventListener('input', () => { if (currentAudio && currentAudio.duration) currentAudio.currentTime = (seekBar.value / 100) * currentAudio.duration; });
dlBtn.addEventListener('click', () => { if (currentItem) downloadAudio(currentItem.audio, `devgift-${currentItem.id}.mp3`); });

async function downloadAudio(url, filename){
  try {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = objUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(objUrl);
    showToast('⬇ Download started', 'success');
  } catch { window.open(url, '_blank'); showToast('Opened audio — long-press to save', 'info'); }
}

/* ============================================================
   GENERATE (NEW API)
   ============================================================ */
async function generateSpeech(opts = {}){
  const text = (opts.text !== undefined ? opts.text : textInput.value).trim();
  const voice = opts.voice || voiceValue.value;

  if (!text){ showToast('Please enter text first.', 'warn'); textInput.focus(); return; }
  if (!voice){ showToast('Please select a voice model.', 'warn'); voiceSelectBtn.click(); return; }

  generateBtn.classList.add('loading');
  generateBtn.innerHTML = '<i class="fas fa-bolt"></i> Synthesizing...';
  
  resultPanel.classList.add('show', 'loading');

  const url = `/api/generate?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(voice)}`;

  let data;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Network error');
    data = await res.json();
    
    // Check for new API success and result format
    if (!data || data.success !== true) throw new Error((data && data.message) || 'Generation failed');
    if (!data.result) throw new Error('No audio URL returned');
  } catch (err) {
    resultPanel.classList.remove('show', 'loading');
    generateBtn.classList.remove('loading');
    generateBtn.innerHTML = '<i class="fas fa-bolt"></i> Synthesize Audio';
    showToast('❌ ' + (err.message || 'Failed'), 'error');
    return;
  }

  resultPanel.classList.remove('loading');
  
  // Mapping to new API response fields (result, voice)
  const item = { 
    id: uid(), 
    text: text, 
    voice: data.voice || voice, 
    audio: data.result, 
    timestamp: data.timestamp || new Date().toISOString() 
  };
  
  currentItem = item;
  setupAudio(item.audio);

  try { await currentAudio.play(); showToast('🎵 Audio generated successfully', 'success'); }
  catch { window.open(item.audio, '_blank'); showToast('🎵 Opened in new tab', 'success'); }

  history.unshift(item);
  if (history.length > 30) history = history.slice(0, 30);
  persistHistory(); renderHistory();

  generateBtn.classList.remove('loading');
  generateBtn.innerHTML = '<i class="fas fa-bolt"></i> Synthesize Audio';
}

generateBtn.addEventListener('click', () => generateSpeech());

/* ============================================================
   SAVE DRAFT
   ============================================================ */
saveBtn.addEventListener('click', () => {
  const text = textInput.value.trim();
  if (!text){ showToast('Please enter text to save.', 'warn'); textInput.focus(); return; }
  
  saved.unshift({ id: uid(), text, voice: voiceValue.value || "NORMAL MALE", timestamp: new Date().toISOString() });
  if (saved.length > 50) saved = saved.slice(0, 50);
  persistSaved(); renderSaved(); showToast('💾 Draft saved successfully', 'success');
});

/* ============================================================
   CARD ACTIONS
   ============================================================ */
historyCards.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  const item = history.find(x => x.id === id); if (!item) return;

  if (act === 'play'){
    if (currentItem && currentItem.audio === item.audio && currentAudio){ currentAudio.currentTime = 0; currentAudio.play().catch(() => window.open(item.audio, '_blank')); }
    else { currentItem = item; resultPanel.classList.add('show'); setupAudio(item.audio); currentAudio.play().catch(() => window.open(item.audio, '_blank')); }
    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (act === 'download') downloadAudio(item.audio, `devgift-${item.id}.mp3`);
  if (act === 'delete'){
    if (!confirm('Delete this audio?')) return;
    history = history.filter(x => x.id !== id); persistHistory(); renderHistory(); showToast('🗑 Deleted', 'info');
  }
});

clearAllBtn.addEventListener('click', () => {
  if (!history.length) return;
  if (!confirm('Delete ALL history?')) return;
  history = []; persistHistory(); renderHistory(); showToast('History cleared', 'info');
});

savedCards.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-sact]'); if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.sact;
  const item = saved.find(x => x.id === id); if (!item) return;

  if (act === 'generate'){
    textInput.value = item.text; voiceValue.value = item.voice; voiceSelectedText.textContent = item.voice; charCount.textContent = item.text.length;
    generateSpeech({ text: item.text, voice: item.voice });
  }
  if (act === 'load'){
    textInput.value = item.text; voiceValue.value = item.voice; voiceSelectedText.textContent = item.voice; charCount.textContent = item.text.length;
    textInput.focus(); textInput.scrollIntoView({ behavior: 'smooth', block: 'center' }); showToast('Loaded into editor', 'info');
  }
  if (act === 'delete'){
    if (!confirm('Delete this draft?')) return;
    saved = saved.filter(x => x.id !== id); persistSaved(); renderSaved(); showToast('🗑 Draft deleted', 'info');
  }
});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  loadHistory(); loadSaved(); renderHistory(); renderSaved();
  renderVoiceList();
  // Default voice
  voiceValue.value = "NORMAL MALE";
  voiceSelectedText.textContent = "NORMAL MALE";
}
init();
</script>
</body>
</html>
