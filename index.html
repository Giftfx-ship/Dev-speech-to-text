<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Gift Voice Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        /* --- PREMIUM LIGHT MODE --- */
        :root {
            --bg-base: #f0f4f8;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-border: rgba(0, 0, 0, 0.05);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --success: #10b981;
            --error-bg: rgba(239, 68, 68, 0.1);
            --error-text: #ef4444;
            --mesh-1: rgba(99, 102, 241, 0.15);
            --mesh-2: rgba(236, 72, 153, 0.1);
            --mesh-3: rgba(16, 185, 129, 0.1);
        }

        /* --- PREMIUM DARK MODE --- */
        [data-theme="dark"] {
            --bg-base: #0b1120;
            --glass-bg: rgba(30, 41, 59, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --primary-glow: rgba(129, 140, 248, 0.3);
            --success: #34d399;
            --error-bg: rgba(248, 113, 113, 0.1);
            --error-text: #f87171;
            --mesh-1: rgba(99, 102, 241, 0.2);
            --mesh-2: rgba(236, 72, 153, 0.15);
            --mesh-3: rgba(16, 185, 129, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-bottom: 80px;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Animated Mesh Background */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 10s infinite alternate;
        }

        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--mesh-1); }
        .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: var(--mesh-2); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: var(--mesh-3); animation-delay: -2s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed;
            inset: 0;
            background: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .loader-ring {
            width: 48px;
            height: 48px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .container {
            max-width: 550px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        body.loaded .container {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
        }

        .theme-toggle {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.08) rotate(15deg);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* --- GLASS CARD --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        }

        /* Form Groups */
        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        textarea, select {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: var(--glass-bg);
        }

        textarea { resize: vertical; min-height: 120px; }
        
        /* Custom Select Arrow */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 16px top 50%;
            background-size: 12px auto;
        }

        /* Switch */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .toggle-row span { font-size: 14px; font-weight: 600; }

        .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--text-muted);
            transition: .4s;
            border-radius: 30px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Grid */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 24px; }

        /* Primary Button */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .btn-primary:active { transform: translateY(1px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Loading state for button */
        .btn-primary.loading {
            color: transparent;
        }
        .btn-primary.loading::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            top: 50%; left: 50%;
            margin: -10px 0 0 -10px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Error Box */
        .error-box {
            display: none;
            background: var(--error-bg);
            color: var(--error-text);
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 20px;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Result Area */
        .result-box {
            display: none;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        audio { width: 100%; margin-bottom: 15px; outline: none; border-radius: 8px; }

        .btn-download {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid var(--input-border);
            transition: all 0.2s;
        }

        .btn-download:hover { background: var(--glass-bg); border-color: var(--text-muted); }

        /* --- HISTORY --- */
        .history-section { margin-top: 35px; }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-header h2 { font-size: 18px; font-weight: 800; }

        .history-item {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: var(--glass-shadow);
            animation: slideIn 0.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .history-text { font-size: 14px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
        .history-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 12px;
        }

        /* --- FLOATING WHATSAPP --- */
        .whatsapp-float {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
            z-index: 100;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .whatsapp-float:hover { transform: scale(1.1) rotate(10deg); }

        /* --- FOOTER --- */
        footer {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            text-align: center;
            padding: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            z-index: 99;
        }

        footer span { color: var(--text-main); font-weight: 800; }
    </style>
</head>

    <script>
        // Official Base URL from Documentation
        const API_BASE_URL = "https://api.omegatech.app/api/ai/text2speech-v3";
        // Fallback Proxy for Vercel/CORS issues
        const CORS_PROXY = "https://api.allorigins.win/raw?url=";

        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const langSelect = document.getElementById('lang-select');
        const generateBtn = document.getElementById('generate-btn');
        const resultBox = document.getElementById('result-box');
        const audioPlayer = document.getElementById('audio-player');
        const downloadLink = document.getElementById('download-link');
        const historyList = document.getElementById('history-list');
        const autoplayToggle = document.getElementById('autoplay-toggle');
        const errorBox = document.getElementById('error-box');
        const preloader = document.getElementById('preloader');
        
        const themeToggle = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');
        
        let typingTimer;
        let isGenerating = false;

        // --- Init App ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                preloader.style.opacity = '0';
                setTimeout(() => {
                    preloader.style.display = 'none';
                    document.body.classList.add('loaded');
                }, 500);
            }, 800); // Artificial delay to show off the dope preloader

            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
            renderHistory();
        });

        // --- Theme Logic ---
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'light' ? 'dark' : 'light');
        });

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'dark') {
                iconSun.style.display = 'block';
                iconMoon.style.display = 'none';
            } else {
                iconSun.style.display = 'none';
                iconMoon.style.display = 'block';
            }
        }

        // --- Instant Play Listener ---
        textInput.addEventListener('input', () => {
            if (!autoplayToggle.checked) return; 
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                if (textInput.value.trim().length > 2) {
                    generateAudio(true); 
                }
            }, 800);
        });

        // --- Generate Audio Logic ---
        async function generateAudio(isAuto = false) {
            const text = textInput.value.trim();
            const voice = voiceSelect.value;
            const language = langSelect.value;

            if (!text || isGenerating) return;

            isGenerating = true;
            errorBox.style.display = 'none';

            if (!isAuto) {
                generateBtn.disabled = true;
                generateBtn.classList.add('loading');
                resultBox.style.display = 'none';
            }

            try {
                // Build direct URL
                const directUrl = `${API_BASE_URL}?text=${encodeURIComponent(text)}&voice=${voice}&language=${language}`;
                
                let response;
                try {
                    // Try Direct Fetch first (Best case scenario)
                    response = await fetch(directUrl);
                    if (!response.ok) throw new Error("Direct fetch failed");
                } catch (e) {
                    console.log("Direct fetch failed, trying proxy...");
                    // If it fails (CORS), fallback to Proxy
                    const proxyUrl = CORS_PROXY + encodeURIComponent(directUrl);
                    response = await fetch(proxyUrl);
                }

                const data = await response.json();

                if (data && data.success === true && data.audio) {
                    resultBox.style.display = 'block';
                    
                    if (audioPlayer.src !== data.audio) {
                        audioPlayer.src = data.audio;
                        audioPlayer.load(); 
                        
                        const playPromise = audioPlayer.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(() => {
                                console.log("Browser blocked autoplay");
                            });
                        }
                    }

                    downloadLink.href = data.audio;
                    downloadLink.setAttribute('download', `dev-gift-${voice}-${Date.now()}.mp3`);

                    saveToHistory(text, voice, data.audio);
                    renderHistory();
                    
                    if (!isAuto) resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    throw new Error("Invalid data format");
                }
            } catch (error) {
                console.error("Error:", error);
                if (!isAuto) {
                    errorBox.textContent = "Network error. The server might be down or the proxy failed.";
                    errorBox.style.display = 'block';
                }
            } finally {
                isGenerating = false;
                if (!isAuto) {
                    generateBtn.disabled = false;
                    generateBtn.classList.remove('loading');
                }
            }
        }

        // --- Storage & History ---
        function saveToHistory(text, voice, audioUrl) {
            let history = JSON.parse(localStorage.getItem('dg_premium_history')) || [];
            const newRecord = {
                id: Date.now(),
                text: text.length > 60 ? text.substring(0, 60) + "..." : text,
                voice: voice,
                audio: audioUrl,
                date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            history.unshift(newRecord);
            if (history.length > 20) history = history.slice(0, 20);
            localStorage.setItem('dg_premium_history', JSON.stringify(history));
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('dg_premium_history')) || [];
            if (history.length === 0) {
                historyList.innerHTML = '<p style="color: var(--text-muted); font-size: 14px; text-align: center; margin-top: 20px;">No generations yet.</p>';
                return;
            }

            historyList.innerHTML = history.map((item, index) => `
                <div class="history-item" style="animation-delay: ${index * 0.05}s">
                    <div class="history-text">"${item.text}"</div>
                    <div class="history-meta">
                        <span style="text-transform: uppercase;">🎙️ ${item.voice}</span>
                        <span>${item.date}</span>
                    </div>
                    <audio controls src="${item.audio}" style="width:100%; height: 40px; margin-bottom: 12px;"></audio>
                    <a href="${item.audio}" download="dev-gift-${item.voice}-${item.id}.mp3" class="btn-download">Download</a>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
